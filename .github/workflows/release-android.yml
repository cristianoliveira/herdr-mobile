name: Android alpha release

on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing alpha tag to build, for example v0.2.0-alpha.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      TMPDIR: /tmp
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const match = /^v(\d+\.\d+\.\d+)-alpha\.([1-9]\d*)$/.exec(tag);
          const { expo } = JSON.parse(readFileSync('app.json', 'utf8'));
          if (!match || match[1] !== expo.version) {
            throw new Error(`Use an alpha tag for app.json version ${expo.version}, such as v${expo.version}-alpha.1`);
          }
          NODE
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          # Unique per workflow run, stable on reruns; above early local/EAS build codes.
          echo "RELEASE_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Check signing secrets before building
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name. Configure repository signing secrets; see docs/releasing.md." >&2
              exit 1
            fi
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install hc for integration tests
        run: |
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.0.12077973' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK with bundled JavaScript
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            --init-script ../scripts/release-version.gradle \
            -PreactNativeArchitectures=arm64-v8a --max-workers=2

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/herdr-release.jks
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'Configure ANDROID_KEYSTORE_BASE64 and signing secrets; see docs/releasing.md.' >&2
            exit 1
          fi
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          bash scripts/sign-release-apk.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            "release/herdr-mobile-$RELEASE_TAG-arm64.apk"
          (cd release && sha256sum -- *.apk > SHA256SUMS)

      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: android-alpha-${{ github.run_id }}
          path: |
            release/*.apk
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-alpha-${{ github.run_id }}
          path: release

      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Create alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS \
            --verify-tag --draft --prerelease --title "Herdr $RELEASE_TAG" --generate-notes \
            --notes 'Standalone ARM64 Android APK; no Metro or Expo Go required. Install on a personal test phone, not the development-only Pixel 7 on mini. Updates may arrive through the preview OTA channel. Signing-key changes cannot upgrade an existing install; do not uninstall to bypass a signature mismatch.'
          gh release edit "$RELEASE_TAG" --draft=false
