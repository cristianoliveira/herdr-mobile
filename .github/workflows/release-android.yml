name: Android alpha release

on:
  push:
    tags: ['v*-alpha.*']
  # Run workflow from main: the next alpha tag is selected automatically.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-alpha-release
  cancel-in-progress: false

jobs:
  build:
    name: Check and build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      CI: '1'
      TMPDIR: /tmp
      HERDR_VARIANT: alpha
      REQUESTED_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Select alpha tag
        id: release
        run: |
          node scripts/alpha-release.mjs
          echo "RELEASE_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install hc for integration tests
        run: |
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.0.12077973' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK with bundled JavaScript
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            --init-script ../scripts/release-version.gradle \
            -PreactNativeArchitectures=arm64-v8a --max-workers=2

      - name: Sign and verify APK with pinned public test key
        run: |
          bash scripts/sign-alpha-apk.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            "release/herdr-alpha-$RELEASE_TAG-arm64.apk"
          (cd release && sha256sum -- *.apk > SHA256SUMS)

      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: android-alpha-${{ github.run_id }}
          path: |
            release/*.apk
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-alpha-${{ github.run_id }}
          path: release

      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Create alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS \
            --target "$RELEASE_COMMIT" --draft --prerelease --title "Herdr Alpha $RELEASE_TAG" --generate-notes \
            --notes 'Standalone ARM64 Herdr Alpha APK; no Metro or Expo Go required. Uses a public test signing key: install only APKs from this repository. Installs alongside Herdr with separate data. No OTA updates; install the next alpha APK to update. Use a personal test phone, not the development-only Pixel 7 on mini. Never uninstall to bypass a signature mismatch.'
          gh release edit "$RELEASE_TAG" --draft=false
